[project]
name = "backend"
version = "0.1.0"
description = "ishopster backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are meant to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Security",
]
