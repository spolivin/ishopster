services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbuser_default}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbpassword_default}
      POSTGRES_DB: ${POSTGRES_DB:-dbname_default}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dbuser_default} -d ${POSTGRES_DB:-dbname_default}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides POSTGRES_HOST from .env: inside the compose network the
      # database is reached by its service name, not localhost.
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # The page's server-side fetch runs inside this container, so it
      # reaches the API by its compose service name, not localhost.
      API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
