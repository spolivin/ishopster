services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbuser_default}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbpassword_default}
      POSTGRES_DB: ${POSTGRES_DB:-dbname_default}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dbuser_default} -d ${POSTGRES_DB:-dbname_default}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
